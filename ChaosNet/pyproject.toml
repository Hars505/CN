[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosnet"
version = "0.1.0"
description = "Interactive Cloud VPC & Auto-Failover Simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chaosnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]